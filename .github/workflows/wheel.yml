# Build grpcio and grpcio-tools wheels with free-threading support for Python 3.14t
name: Build Wheels

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build_grpcio:
    name: Build grpcio on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Can add windows-latest, macos-latest later if needed

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules
        run: |
          echo "Checking submodules..."
          ls -la third_party/
          ls -la third_party/abseil-cpp/ | head -5
          ls -la third_party/boringssl-with-bazel/ | head -5
          ls -la third_party/cares/cares/ | head -5
          echo "Submodules OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Only build for Python 3.14 free-threaded
          CIBW_BUILD: "cp314t-*"
          # Only manylinux for now (CHS needs Linux)
          CIBW_ARCHS_LINUX: "x86_64"
          # Use manylinux_2_28 for newer glibc
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # Build with Cython - pyproject.toml handles deps
          CIBW_ENVIRONMENT: >
            GRPC_PYTHON_BUILD_WITH_CYTHON=1
          # Skip PyPy and musllinux
          CIBW_SKIP: "pp* *-musllinux_*"
          # Test the wheel works
          CIBW_TEST_COMMAND: "python -c \"import grpc; print(grpc.__version__)\""
          # More verbose for debugging
          CIBW_BUILD_VERBOSITY: 2

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: grpcio-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_grpcio_tools:
    name: Build grpcio-tools on ${{ matrix.os }}
    needs: build_grpcio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download grpcio wheel
        uses: actions/download-artifact@v4
        with:
          name: grpcio-wheels-${{ matrix.os }}
          path: grpcio-wheelhouse

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Prepare grpcio-tools source tree
        run: |
          # Copy source files from repo root into grpcio_tools build directory
          # (mirrors what make_grpcio_tools.py does)
          TOOLS_DIR=tools/distrib/python/grpcio_tools

          # grpc_root: compiler sources and includes
          mkdir -p $TOOLS_DIR/grpc_root/src $TOOLS_DIR/grpc_root/include
          cp -r src/compiler $TOOLS_DIR/grpc_root/src/
          cp -r include/* $TOOLS_DIR/grpc_root/include/

          # third_party: abseil, protobuf, utf8_range
          mkdir -p $TOOLS_DIR/third_party/abseil-cpp
          cp -r third_party/abseil-cpp/absl $TOOLS_DIR/third_party/abseil-cpp/
          mkdir -p $TOOLS_DIR/third_party/protobuf/third_party
          cp -r third_party/protobuf/src $TOOLS_DIR/third_party/protobuf/
          cp -r third_party/protobuf/upb $TOOLS_DIR/third_party/protobuf/
          cp -r third_party/protobuf/upb_generator $TOOLS_DIR/third_party/protobuf/
          cp -r third_party/protobuf/third_party/utf8_range $TOOLS_DIR/third_party/protobuf/third_party/

          # Stage grpcio wheel for dependency resolution inside build container
          mkdir -p $TOOLS_DIR/.grpcio-dep
          cp grpcio-wheelhouse/*.whl $TOOLS_DIR/.grpcio-dep/

      - name: Build grpcio-tools wheels
        run: python -m cibuildwheel --output-dir wheelhouse tools/distrib/python/grpcio_tools
        env:
          CIBW_BUILD: "cp314t-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ENVIRONMENT: >
            GRPC_PYTHON_BUILD_WITH_CYTHON=1
          CIBW_SKIP: "pp* *-musllinux_*"
          # Install our grpcio wheel before build so grpcio-tools can resolve its dependency
          CIBW_BEFORE_BUILD: "pip install {package}/.grpcio-dep/*.whl"
          # Also install before test
          CIBW_BEFORE_TEST: "pip install {package}/.grpcio-dep/*.whl"
          CIBW_TEST_COMMAND: >
            python -c "from grpc_tools import protoc; print('grpcio-tools OK')"
          CIBW_BUILD_VERBOSITY: 2

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: grpcio-tools-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Separate job to test free-threading
  test_freethreading:
    name: Test free-threading
    needs: [build_grpcio, build_grpcio_tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grpcio-wheels-ubuntu-latest
          path: wheelhouse

      - uses: actions/download-artifact@v4
        with:
          name: grpcio-tools-wheels-ubuntu-latest
          path: wheelhouse

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - name: Install and test
        run: |
          pip install wheelhouse/*.whl
          python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'GIL enabled before import: {sys._is_gil_enabled()}')
          import grpc
          print(f'grpc version: {grpc.__version__}')
          print(f'GIL enabled after import: {sys._is_gil_enabled()}')
          if sys._is_gil_enabled():
              print('ERROR: GIL was enabled by grpc import!')
              sys.exit(1)
          else:
              print('SUCCESS: GIL remains disabled after grpc import')
          from grpc_tools import protoc
          print('grpcio-tools import OK, GIL still disabled')
          "
